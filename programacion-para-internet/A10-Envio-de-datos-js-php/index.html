<html>

 <head>

	<meta charset="UTF-8">
  	<title>Formulario request</title>
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 </head>

 <body>
	<form id="forma01" name="forma01" action="./recibe.php" method="POST" novalidate>
		<label>
			Nombre:
			<input id="campo1" type="text" name="nombre" placeholder="Escribe tu nombre" required>
		</label>
		
		<br>
		<label>Correo:</label>
		<input type="email" name="correo" value="@udg.mx">
		<br>
		<label for="sexo">Genero:</label>
		<input type="radio" name="sexo" value="F">Femenino
		<input type="radio" name="sexo" value="M">Masculino
		<br>
		<input type="checkbox" name="boletin" value="1" checked>
		<label for="boletin">Recibir Boletín</label>
		<br>
		<label for="comentario">Comentario:</label><br>
		<textarea name="comentario" cols="30" rows="5"></textarea>
		<br>
		<label for="carrera">Carrera:</label>
		<select name="carrera">
			<option value="0" selected>Selecciona</option>
			<option value="1">Ing. Informática</option>
			<option value="2">Ing. Computación</option>			
		</select>
		<br>
		<label for="pasw">Contraseña:</label>
		<input type="password" name="pasw">
		<br>
		<label for="promedio">Promedio:</label>
		<input type="number" name="promedio" min="60" max="100">
		<br>
		<label for="fecha">Fecha nacimiento:</label>
		<input type="date" name="fecha">
		
		<br>
		<input type="submit" value="Enviar con input">
	</form>
	<div id="mensaje"></div>
	
	<script>
		$('#forma01').submit(function(evento) {
			if (!validarFormulario()) {
				evento.preventDefault();
			}
		});

		function validarFormulario() {
			var formularioCompleto =
				$('input[name="nombre"]').val().trim() != '' &&
				$('input[name="correo"]').val().trim() != '' &&
				$('input[name="sexo"]:checked').length > 0 &&
				$('input[name="boletin"]:checked').length > 0 &&
				$('textarea[name="comentario"]').val().trim() != '' &&
				$('select[name="carrera"]').val() != '0' &&
				$('input[name="pasw"]').val() != '' &&
				$('input[name="promedio"]').val() != '' &&
				$('input[name="fecha"]').val() != '';

			if (!formularioCompleto) {
				$('#mensaje').html('Faltan campos por llenar');
				return false;
			}

			return true;
		}
	</script>
 </body>

</html>
