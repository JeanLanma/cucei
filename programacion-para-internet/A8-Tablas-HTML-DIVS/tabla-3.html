<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Programación para Internet - A8 Tabla 3</title>
    <style>
        .tabla { width: 960px; height: 800px; border: 1px solid black; }
        .fila { display: flex; }
        .fila1 { height: 50px; }
        .fila2 { height: 700px; }
        .fila3 { height: 50px; }
        .celda { border: 1px solid black; box-sizing: border-box; padding: 10px; }
        .completa { width: 100%; }
        .menu { width: 100px; }
        .contenido { flex: 1; }
        .interna { width: 100%; height: 100%; }
        .mitad-alto { height: 50%; }
    </style>
</head>
<body>
    <div class="tabla">
        <div class="fila fila1">
            <div class="celda completa">A</div>
        </div>
        <div class="fila fila2">
            <div class="celda menu">B</div>
            <div class="celda contenido">
                <div class="tabla interna">
                    <div class="fila mitad-alto">
                        <div class="celda completa">C</div>
                    </div>
                    <div class="fila mitad-alto">
                        <div class="celda completa">D</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="fila fila3">
            <div class="celda completa">E</div>
        </div>
    </div>
</body>
</html>
